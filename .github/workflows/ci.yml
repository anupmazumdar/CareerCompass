name: TalentAI Monorepo CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Root and Backend Dependencies
        run: |
          npm install
          cd backend && npm install

      - name: Run Database Migrations & Seeding
        run: |
          node database/migrations/migrate.js
          node database/seeds/seed.js

      - name: Run Backend Unit, Integration, Security, and E2E Tests
        run: cd backend && npm test

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Frontend Dependencies
        run: cd frontend && npm install --legacy-peer-deps

      - name: Run Frontend Tests
        run: cd frontend && CI=true npm test -- --watchAll=false

      - name: Verify Frontend Production Build
        run: cd frontend && npm run build
